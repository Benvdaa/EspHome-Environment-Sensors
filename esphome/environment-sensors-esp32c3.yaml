# ⬇ Substitutions ⬇ #
substitutions:
  time_timezone: "Europe/Amsterdam"

# ⬇ Esphome ⬇ #
esphome:  
  name: ${name}
  name_add_mac_suffix: true
  comment: '${device_description}'

  project:
    name: "vanderAa.Environment Sensor Esp32c3 Project"
    version: "${project_version}"
  min_version: 2025.10.0

# ⬇ ESP32 C3 board⬇ #
esp32:
  board: esp32-c3-devkitm-1 

# ⬇ dashboard import ⬇ #
dashboard_import:
  package_import_url: github://Benvdaa/EspHome-Environment-Sensors/esphome/environment-sensors-esp32c3.yaml@main
  import_full_config: true

  # environment-sensors-esp32c3.yaml
# ⬇ packages ⬇ #
packages:
  remote_package:
    url: https://github.com/Benvdaa/EspHome-Environment-Sensors/
    ref: main
    files:
      - esphome/components/environment-esp32c3.yaml
      - esphome/components/environment-bme680-bsec2.yaml
      - esphome/components/environment-bh1750.yaml
    refresh: 0d  
