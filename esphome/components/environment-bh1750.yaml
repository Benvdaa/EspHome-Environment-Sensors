




substitutions:
  bh1750_multiply: 5.0
  
# Hardware: 
  # Wemos Lolin ESP32-C3 mini
  # Espressif ESP32-C3FH4 160 MHz 1 Core
  # ESP32-C3 WIFI & Bluetooth LE RISC-V Single-Core CPU
  # BME280 i2c 0x76
  # BME680 i2c 0x77
  # BH1750 i2c 0x23


#------------------------#  sensoren #------------------------# 

# ⬇ Sensor informatie sensoren voor in ha ⬇ #
sensor:
    # BH1750FVI Ambient Light Sensor  
  - platform: bh1750
    name: "BH1750 Illuminance"
    device_class: "illuminance"
    icon: "mdi:brightness-5"    
    i2c_id: i2c_bus_a
    address: 0x23  #0x23  0x5C
    filters: 
      - multiply: ${bh1750_multiply}      
    update_interval: 10s

# ⬇ Text informatie sensoren voor in ha ⬇ #
text_sensor:
