# Lolin Wemos Esp32 C3 Mini board # 
# HARDWARE: ESP32C3 160MHz, 320KB RAM, 4MB Flash
# RGB Led GPIO7
# RGB Colors:
 # - White:  hex xFFFFFF   | R 100%, G 100%, B 100%  | G 255, R 255, B 255 
 # - Blue:   hex x3200FF   | R 20% , G 0%  , B 100%  | R 50, G 0, B 250
 # - Red :   hex xFFFFFF   | R 100%, G 0%  , B 20%   | R 250, G 0, B 50
 # - Yelow:  hex xFFFFFF   | R 100%, G 100%, B 0%    | R 250, G 250, B 0
 # - Orange: hex xFFFFFF   | R 100%, G 48% , B 0%    | R 255 , G 115 , B 0
 # - Green:  hex xFFFFFF   | R 0%  , G 100%, B 20%   | R 0, G 250, B 50



substitutions:
  time_timezone: "Europe/Amsterdam"
  # vdate: "v 0.0.4 2026-04-22"
  project_version: "0.0.7" # From 22-04-2026 new version
  date: "26-11-2026"
  device_description: "${friendly_name} gemaakt door van der Aa versie: ${project_version} - date ${date}."

  name: c3-environment
  friendly_name: C3 Environment

  vdate: "0.0.7 2026-11-26"
  # version: "0.0.0"
  #   device_description: "C3 Environment sensors gemaakt door vanderaa-ict.com versie ${vdate}."  
  board: c3mini
  sensor1: bme680
  sensor2: bh1750
  sensor3: 

  bme680_operating_age: 28d
  bme680_sample_rate: LP
  bme680_temperature_offset: 2.1   # Correction on bsec temperature correction
  bme680_humidity_offset: 0.0      # Correction on Sensor Offset
  
# Hardware: 
  # Wemos Lolin ESP32-C3 mini
  # Espressif ESP32-C3FH4 160 MHz 1 Core
  # ESP32-C3 WIFI & Bluetooth LE RISC-V Single-Core CPU
  # BME680 i2c 0x77
  # BH1750 i2c 0x23

esphome:
  name: ${name} ## solis-esphome-esp32c3
  friendly_name: ${friendly_name} ## Ginlong Solis Inverter
  name_add_mac_suffix: false
  comment: ${device_description}
  project: 
    name: "Benvdaa.Environment-Sensors C3 Project"
    version: ${project_version} 


# Board
esp32:
  board: esp32-c3-devkitm-1
  framework:
    #type: arduino
    type: esp-idf


# Enable logging
logger:
  #level: DEBUG

# Enable Home Assistant API
api:
  id: ha_api
  encryption:   # Uses key set by Home Assistant


# Enable OTA
ota:
  platform: esphome  
   # password: # Uses key set by Home Assistant
  #encryption: # Uses key set by Home Assistant

# Enable Wifi

wifi:
  min_auth_mode: WPA2
   #  auth expired errors work around:
   # The amount of TX power for the WiFi interface from 8.5dB to 20.5dB. Default for ESP8266 is 20dB, 20.5dB might cause unexpected restarts.
  # output_power: 8.5

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    #ssid: "Solis-Esphome-Esp32C3"
    password: "12345678"
    

captive_portal:

# Sets up the improv via serial client for Wi-Fi provisioning
# Provisioning via USB/serial
improv_serial:

# Provisioning via Bluetooth LE
improv_ble:
# esp32_improv:
  authorizer: none
  
# ⬇ Enable Web Server component ⬇ # 
web_server:
  port: 80
  version: 3    

http_request:
  verify_ssl: false

# ⬇ Enable Time component ⬇ #
time:
  - platform: homeassistant
    id: time_homeassistant  

# ⬇ Enable I2C Bus  #--------------------- ⬇ #
i2c:
  sda: GPIO09
  scl: GPIO10
  id: i2c_bus_a
  scan: True
  frequency: 400khz
  #Found i2c device at address 0x24
  #Found i2c device at address 0x3C



# ⬇ Enable SPI RGB Led  #--------------------- ⬇ #
light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB       # <--- Vervangt rgb_order (voorkomt waarschuwingen in de toekomst)
    ## rgb_order: GRB
    pin: GPIO7
    num_leds: 1
    #rmt_channel: 0
    chipset: ws2812
    name: "Status LED"
    id: "activity_led"
    default_transition_length: 0.1s 
    restore_mode: ALWAYS_OFF
    flash_transition_length: 100ms
    entity_category: config
    disabled_by_default: true # intentionally disabled, remove if you know what you are doing

# ⬇ switches to control from HA ⬇ #
switch:
  - platform: template
    name: "Status LED enabled"
    id: led_enabled
    icon: mdi:alarm-light-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    disabled_by_default: true # intentionally disabled, remove if you know what you are doing



  
# ⬇ Button Configuration  ⬇ #
button:
  - platform: factory_reset
    name: Restart with factory default settings
    id: reset_all
  - platform: restart
    name: Reboot device

# ⬇ Sensor Configuration  ⬇ #
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    icon: mdi:wifi
 # ⬇ Uptime informatie sensor ⬇ #
  - platform: uptime
    type: seconds         
    name: Uptime Sensor 
    

# ⬇ Text Sensor Configuration  ⬇ #
text_sensor:

  # ⬇ Wifi informatie sensor ⬇ #
  - platform: wifi_info
    
    ip_address: 
      name: Wifi IP-adres
      icon: mdi:ip-network
    mac_address:
      name: Wifi Mac-adres  # 
      icon: mdi:folder-key-network-outline
   # dns_address:
   #  name: Wifi DNS Address
   #  icon: mdi:ip-network
    ssid:
      name: Wifi Ssid  # 
      icon: mdi:folder-key-network-outline
    bssid:
      name: Wifi Ssid Mac  # 
      icon: mdi:folder-key-network-outline

  
  # ⬇ ESPHome Version information sensor ⬇ #
  - platform: version
    name: "ESPHome Version"     
    hide_timestamp: true 
        
      
